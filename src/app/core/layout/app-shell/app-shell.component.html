<div *ngIf="layout$ | async as layout" class="fixed inset-0 overflow-hidden bg-page">
  <a [href]="contentLink" class="sr-only z-20 rounded-lg bg-surface p-3 text-brand focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:outline-none focus:ring-2 focus:ring-brand">
    Skip to content
  </a>
  <div appPageTransition data-page-surface class="absolute inset-0 grid grid-rows-[auto_minmax(0,1fr)] overflow-hidden bg-page">
    <app-header *ngIf="!layout.featureHeader" [scrolled]="headerScrolled" />

  <main id="main-content" tabindex="0" aria-label="Page content"
    #content (scroll)="headerScrolled = content.scrollTop > 0"
    [ngClass]="layout.featureHeader ? '' : '-mt-[calc(4.5rem+1px+env(safe-area-inset-top))] pt-[calc(4.5rem+1px+env(safe-area-inset-top))]'"
    class="relative z-0 row-start-2 min-h-0 overflow-y-auto overscroll-y-contain pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)] scroll-pb-[calc(5.5rem+env(safe-area-inset-bottom))] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-brand">
    <div [ngClass]="layout.featureHeader ? '' : 'px-4 pt-6 sm:px-6 sm:pt-8'"
      class="mx-auto w-full max-w-5xl pb-[calc(5.5rem+env(safe-area-inset-bottom))]">
      <router-outlet />
    </div>
  </main>
  </div>

  <app-bottom-navigation class="pointer-events-none fixed inset-x-0 bottom-0 z-30" />
</div>
