<dialog #dialog aria-labelledby="selection-title" aria-describedby="selection-note" (cancel)="onCancel($event)"
  (click)="onBackdrop($event)" (keydown)="onKeydown($event)"
  class="fixed inset-0 m-0 h-full max-h-none w-full max-w-none items-end justify-center border-0 bg-transparent p-0 open:flex">
  <section class="selection-panel max-h-[85dvh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-surface px-5 pt-4 pb-[calc(1.25rem+env(safe-area-inset-bottom))] shadow-xl">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-brand">Demo product</p>
        <h2 id="selection-title" class="mt-1 text-xl font-bold">{{ product.name }}</h2>
      </div>
      <button type="button" autofocus aria-label="Close product selection" (click)="close()"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-page focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
        <lucide-icon name="x" aria-hidden="true" [size]="22" />
      </button>
    </div>
    <div class="my-5 flex items-center gap-4">
      <div class="flex h-20 w-20 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-page text-text-muted">
        <img *ngIf="product.imageUrl && !imageFailed; else placeholder" [src]="product.imageUrl" [alt]="product.imageAlt || product.name" decoding="async"
          (error)="imageFailed = true" class="h-full w-full object-cover" />
        <ng-template #placeholder><lucide-icon name="box" aria-hidden="true" [size]="36" /></ng-template>
      </div>
      <div class="min-w-0">
        <p class="break-words text-xs text-text-muted">SKU: {{ product.sku }}</p>
        <p class="mt-1 font-bold">MMK {{ product.price | number:'1.0-0' }}</p>
        <p *ngIf="product.stock != null" class="mt-1 text-xs text-text-muted">Demo stock: {{ product.stock }}</p>
      </div>
    </div>
    <fieldset *ngIf="product.variants?.length" class="mb-5">
      <legend class="mb-2 text-sm font-semibold">Size</legend>
      <div class="flex flex-wrap gap-2">
        <label *ngFor="let option of product.variants" class="cursor-pointer">
          <input type="radio" name="product-variant" [value]="option" [checked]="variant === option"
            (change)="variant = option" class="peer sr-only" />
          <span class="flex min-h-[44px] items-center rounded-xl border border-border px-4 text-sm peer-checked:border-brand peer-checked:bg-brand-soft peer-checked:text-brand peer-focus-visible:ring-2 peer-focus-visible:ring-brand">{{ option }}</span>
        </label>
      </div>
    </fieldset>
    <div class="flex items-center justify-between gap-4">
      <span id="quantity-label" class="text-sm font-semibold">Quantity</span>
      <div class="flex items-center rounded-xl border border-border">
        <button type="button" aria-label="Decrease quantity" [disabled]="quantity <= 1" (click)="updateQuantity(quantity - 1)"
          class="flex h-11 w-11 items-center justify-center rounded-l-xl text-brand disabled:text-text-muted disabled:opacity-40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
          <lucide-icon name="minus" aria-hidden="true" [size]="18" />
        </button>
        <output aria-labelledby="quantity-label" aria-live="polite" class="min-w-[2rem] text-center text-sm font-semibold">{{ quantity }}</output>
        <button type="button" aria-label="Increase quantity" (click)="updateQuantity(quantity + 1)"
          class="flex h-11 w-11 items-center justify-center rounded-r-xl text-brand focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
          <lucide-icon name="plus" aria-hidden="true" [size]="18" />
        </button>
      </div>
    </div>
    <p id="selection-note" class="my-5 text-sm leading-6 text-text-muted">Selection preview only. Cart functionality is not connected; no stock or sales will be changed.</p>
    <button type="button" disabled aria-describedby="selection-note" class="min-h-[48px] w-full rounded-xl bg-brand px-4 font-semibold text-white opacity-50 disabled:cursor-not-allowed">Add to Cart</button>
  </section>
</dialog>
